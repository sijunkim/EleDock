# 6시간마다 웹사이트·appcast·최신 릴리스 파일이 공개 상태인지 점검한다. 문제가 있으면 실패해 GitHub 이 알린다.
name: Site check

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 공개 상태 점검
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site_check.py
